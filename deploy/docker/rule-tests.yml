rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="nodes",instance="host-a:9100"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ExporterUnavailable
        exp_alerts:
          - exp_labels:
              job: nodes
              instance: host-a:9100
              severity: warning
            exp_annotations:
              summary: Exporter host-a:9100 is unreachable
              description: Check networking and exporter health. This is not proof the application is down.
      - eval_time: 8m
        alertname: ExporterUnavailable
        exp_alerts: []
