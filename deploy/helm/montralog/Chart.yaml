apiVersion: v2
name: montralog
description: Montralog gateway, durable OpenTelemetry collector, and optional metrics backends
type: application
version: 0.8.2
appVersion: 0.8.2
kubeVersion: ">=1.27.0-0"
keywords: [observability, monitoring, logs, tracing, opentelemetry]
home: https://github.com/montralog/montralog
icon: https://raw.githubusercontent.com/montralog/montralog/main/docs/assets/montralog-avatar.png
sources:
  - https://github.com/montralog/montralog
maintainers:
  - name: Montralog
    url: https://github.com/montralog
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/montralog/montralog/blob/main/docs/README.md
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: Update pinned Prometheus, Alertmanager, Collector and Python runtime images.
    - kind: security
      description: Scan all bundled backend images and reject new or unapproved HIGH/CRITICAL findings before release.
