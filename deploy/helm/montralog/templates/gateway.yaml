apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "montralog.fullname" . }}
  labels: {{- include "montralog.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "montralog.fullname" . }}
  labels: {{- include "montralog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "montralog.selector" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "montralog.fullname" . }}
  labels: {{- include "montralog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    {{- if eq .Values.database.mode "sqlite" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- end }}
  selector:
    matchLabels:
      {{- include "montralog.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "montralog.selector" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "montralog.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "montralog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "montralog.containerSecurity" . | nindent 12 }}
          env: {{- include "montralog.environment" . | nindent 12 }}
          ports: [{name: http, containerPort: 8080}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /data}
        {{- if eq .Values.database.mode "sqlite" }}
        - name: notifications
          image: {{ include "montralog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, montralog.notifications]
          securityContext: {{- include "montralog.containerSecurity" . | nindent 12 }}
          env: {{- include "montralog.environment" . | nindent 12 }}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        {{- end }}
        {{- if eq .Values.database.mode "sqlite" }}
        - name: retention
          image: {{ include "montralog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, scripts/retention.py]
          securityContext: {{- include "montralog.containerSecurity" . | nindent 12 }}
          env: {{- include "montralog.environment" . | nindent 12 }}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: data
          {{- if eq .Values.database.mode "sqlite" }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "montralog.fullname" .) }}
          {{- else }}
          emptyDir: {sizeLimit: 16Mi}
          {{- end }}
{{- if and (eq .Values.database.mode "sqlite") (empty .Values.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "montralog.fullname" . }}
  labels: {{- include "montralog.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "montralog.fullname" . }}
  labels: {{- include "montralog.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "montralog.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
{{- end }}
