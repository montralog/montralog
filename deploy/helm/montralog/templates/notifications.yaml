{{- if eq .Values.database.mode "postgresql" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "montralog.fullname" . }}-notifications
  labels: {{- include "montralog.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "montralog.selector" . | nindent 6 }}
      app.kubernetes.io/component: notifications
  template:
    metadata:
      labels:
        {{- include "montralog.selector" . | nindent 8 }}
        app.kubernetes.io/component: notifications
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: notifications
          image: {{ include "montralog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, montralog.notifications]
          env: {{- include "montralog.environment" . | nindent 12 }}
          securityContext: {{- include "montralog.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
{{- end }}
