{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "montralog.fullname" . }}
  labels: {{- include "montralog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "montralog.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector: {{- toYaml .Values.networkPolicy.clientNamespaceSelector | nindent 12 }}
        - namespaceSelector: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
  egress:
    - to:
        - podSelector: {}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 9090}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
