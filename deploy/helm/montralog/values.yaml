# Public release image; pin image.digest for production rollouts.
image:
  repository: ghcr.io/montralog/montralog
  tag: 0.9.0
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicaCount: 1
auth:
  # Create this Secret separately; credentials never enter Helm values/release history.
  existingSecret: montralog-auth
  readTokenKey: read-token
  ingestTokenKey: ingest-token
encryption:
  # Existing operator-managed Secret; never put the key in Helm values.
  existingSecret: montralog-encryption
  key: encryption-key

database:
  # sqlite: one replica only. postgresql: external operator-managed database.
  mode: sqlite
  existingSecret: ""
  urlKey: database-url
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi
retentionDays: 7
service:
  port: 8080
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  extraEgress: []
  # Additional namespaces permitted to call gateway/OTLP. Same namespace is allowed.
  clientNamespaceSelector:
    matchLabels:
      montralog-client: "true"
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
collector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
prometheus:
  enabled: true
  # Required URL when bundled Prometheus is disabled.
  externalUrl: ""
  image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
  persistence: {size: 20Gi, storageClassName: ""}
  retention: 7d
  retentionSize: 10GB
  extraScrapeConfigs: []
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
alertmanager:
  enabled: true
  image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
  persistence: {size: 1Gi, storageClassName: ""}
  # Optional Secret with alertmanager.yml. Default receiver sends no notifications.
  existingConfigSecret: ""
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
