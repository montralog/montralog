name: Release preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-preview
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: azure/setup-helm@v4
        with: {version: v3.19.4}
      - run: python -m pip install build==1.3.0 PyYAML==6.0.3 pip-audit==2.10.1
      - name: Check version alignment and package source
        run: |
          python scripts/check_release.py
          python -m build
          helm package deploy/helm/montralog --destination dist
          git archive --format=zip --prefix=montralog-0.5.1-rc1/ -o dist/montralog-0.5.1-rc1-source.zip HEAD
          pip-audit -r requirements.txt --format cyclonedx-json --output dist/montralog-0.5.1-rc1-dependencies.cdx.json
      - uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: dist/security-reports
      - name: Package security evidence and checksums
        run: |
          tar -czf dist/montralog-0.5.1-rc1-security-reports.tar.gz -C dist security-reports
          rm -r dist/security-reports
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish tagged prerelease from the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.1-rc1 dist/* --target "$GITHUB_SHA" --title 'Montralog 0.5.1-rc1 — security-focused preview' --notes-file docs/RELEASE-0.5.1.md --prerelease
