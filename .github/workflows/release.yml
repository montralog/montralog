name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-stable
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: azure/setup-helm@v4
        with: {version: v3.19.4}
      - run: python -m pip install build==1.3.0 PyYAML==6.0.3 pip-audit==2.10.1
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then echo 'Version already released; choose a new version'; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: verified-container-image
          path: ${{ runner.temp }}/verified-image
      - name: Load and exercise the exact scanned image
        env:
          VERIFIED_IMAGE: ${{ runner.temp }}/verified-image
        run: |
          docker load -i "$VERIFIED_IMAGE/image.tar"
          test "$(docker image inspect montralog:security --format '{{.Id}}')" = "$(cat "$VERIFIED_IMAGE/image-id.txt")"
          test "$(docker image inspect montralog:security --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:rw,nosuid,noexec,size=64m,mode=1777 --entrypoint python montralog:security scripts/functional_review_smoke.py
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:rw,nosuid,noexec,size=64m,mode=1777 --entrypoint python montralog:security scripts/check_runtime.py
      - name: Measure the exact scanned and published image
        run: |
          python scripts/check_bootstrap.py --image montralog:security --output dist/acceptance-reports/bootstrap.json
          python scripts/acceptance_load.py --image montralog:security --output dist/acceptance-reports/load.json
          python scripts/reliability_soak.py --image montralog:security --output dist/acceptance-reports/reliability-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-image-acceptance-reports
          path: dist/acceptance-reports/
          retention-days: 90
      - name: Publish versioned image and latest alias
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          IMAGE=ghcr.io/montralog/montralog
          docker tag montralog:security "$IMAGE:0.7.0"
          docker push "$IMAGE:0.7.0"
          DIGEST=$(docker image inspect "$IMAGE:0.7.0" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/IMAGE_DIGESTS.txt
          docker tag montralog:security "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Require anonymous public pull access
        run: python scripts/check_registry_image.py --reference ghcr.io/montralog/montralog:0.7.0 --digest '${{ steps.image.outputs.digest }}' --wait-seconds 600
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/montralog/montralog
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Check version alignment and package source
        run: |
          python scripts/check_release.py
          python -m build
          helm package deploy/helm/montralog --destination dist
          git archive --format=zip --prefix=montralog-0.7.0/ -o dist/montralog-0.7.0-source.zip HEAD
          pip-audit -r requirements.txt --format cyclonedx-json --output dist/montralog-0.7.0-dependencies.cdx.json
      - uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: dist/security-reports
      - uses: actions/download-artifact@v4
        with:
          name: browser-test-report
          path: ${{ runner.temp }}/browser-report
      - uses: actions/download-artifact@v4
        with:
          name: local-ai-evaluation
          path: dist/ai-reports
      - name: Package security evidence and checksums
        run: |
          tar -czf dist/montralog-0.7.0-security-reports.tar.gz -C dist security-reports
          tar -czf dist/montralog-0.7.0-browser-tests.tar.gz -C "$RUNNER_TEMP" browser-report
          tar -czf dist/montralog-0.7.0-acceptance-reports.tar.gz -C dist acceptance-reports
          tar -czf dist/montralog-0.7.0-ai-evaluation.tar.gz -C dist ai-reports
          rm -r dist/security-reports dist/acceptance-reports dist/ai-reports
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish stable release from the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0 dist/* --target "$GITHUB_SHA" --title 'Montralog 0.7.0' --notes-file docs/RELEASE-0.7.0.md --latest
