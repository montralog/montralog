name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: montralog_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d montralog_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install -e ".[server]" -r requirements-dev.txt
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
        env:
          MONTRALOG_TEST_DATABASE_URL: postgresql://postgres:ci-ephemeral-only@localhost:5432/montralog_test
      - run: for file in src/montralog/static/*.js; do node --check "$file"; done
      - run: node --test tests/test_studio_rendering.cjs
      - run: python scripts/functional_review_smoke.py
      - run: python -m build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python scripts/setup.py
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f deploy/docker/compose.ai.yaml config --quiet
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - run: docker run --rm -v "$PWD/deploy/docker:/rules:ro" --workdir /rules --entrypoint promtool prom/prometheus:v3.13.3 test rules rule-tests.yml
      - run: docker compose run --rm --no-deps collector validate --config=/etc/otelcol/config.yml
      - run: docker compose run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - run: python scripts/check_image_secrets.py
      - run: docker compose up -d --no-build --wait --wait-timeout 180
      - run: python scripts/check_install.py
      - run: python scripts/smoke.py
        env: {MONTRALOG_REQUIRE_PROMETHEUS: "1"}
      - run: python scripts/collector_smoke.py
      - if: always()
        run: docker compose down
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: azure/setup-helm@v4
        with: {version: v3.19.4}
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/check_chart.py
      - run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 -o /tmp/kind-linux-amd64
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64.sha256sum -o /tmp/kind.sha256sum
          cd /tmp
          sha256sum --check kind.sha256sum
          chmod +x /tmp/kind-linux-amd64
          mv /tmp/kind-linux-amd64 /tmp/kind
      - run: /tmp/kind create cluster --name montralog-verify --kubeconfig "$RUNNER_TEMP/montralog-kubeconfig" --wait 120s
      - run: docker buildx build --provenance=false --sbom=false --load -t ghcr.io/montralog/montralog:0.7.0 .
      - run: |
          docker pull prom/prometheus:v3.13.3
          docker pull prom/alertmanager:v0.28.1
          docker pull otel/opentelemetry-collector-contrib:0.161.0
          docker pull postgres:17.6-alpine
          for image in ghcr.io/montralog/montralog:0.7.0 prom/prometheus:v3.13.3 prom/alertmanager:v0.28.1 otel/opentelemetry-collector-contrib:0.161.0 postgres:17.6-alpine; do
            python scripts/load_kind_gateway.py --image "$image"
          done
      - run: python scripts/cluster_smoke.py --kubeconfig "$RUNNER_TEMP/montralog-kubeconfig"
      - run: helm package deploy/helm/montralog --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: montralog-helm-chart
          path: dist/*.tgz
      - if: always()
        run: if [ -x /tmp/kind ]; then /tmp/kind delete cluster --name montralog-verify --kubeconfig "$RUNNER_TEMP/montralog-kubeconfig"; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: mkdir -p security-reports
      - name: Known runtime dependency vulnerabilities
        run: pip-audit -r requirements.txt --format json --output security-reports/dependencies.json
      - name: Static report and high severity gate
        run: |
          bandit -r src/montralog -f json -o security-reports/bandit-all.json --exit-zero
          bandit -r src/montralog -lll -f json -o security-reports/bandit-high.json
      - name: Build exact container for security inspection
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t montralog:security .
      - name: Scan saved image with the pinned official Trivy container
        run: |
          mkdir -p image-scan
          docker image save -o image-scan/image.tar montralog:security
          docker image inspect montralog:security --format '{{.Id}}' > image-scan/image-id.txt
          TRIVY_IMAGE=aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          docker run --rm -v "$PWD/image-scan:/scan:ro" -v "$PWD/security-reports:/reports" "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln --list-all-pkgs --format json --output /reports/image.json
          python scripts/check_security_report.py security-reports/image.json --summary security-reports/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: security-reports/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-container-image
          path: image-scan/
          compression-level: 1
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install -e ".[server]" -r requirements-dev.txt
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: tests/browser/playwright-report/

  resilience:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t montralog:acceptance .
      - run: python scripts/check_bootstrap.py --image montralog:acceptance --output acceptance-reports/bootstrap.json
      - run: python scripts/acceptance_load.py --image montralog:acceptance --output acceptance-reports/load.json
      - name: Verify sustained ingestion, restart, delivery recovery and backup restore
        run: python scripts/reliability_soak.py --image montralog:acceptance --output acceptance-reports/reliability-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-reports
          path: acceptance-reports/
          retention-days: 90
