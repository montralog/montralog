name: Publish Helm repository
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: helm-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Download published preview chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public
          gh release download v0.5.0-rc1 --pattern 'montralog-0.5.0-rc.1.tgz' --dir public
          helm show chart public/montralog-0.5.0-rc.1.tgz
          helm repo index public --url https://montralog.github.io/montralog
          cp deploy/helm/artifacthub-repo.yml public/artifacthub-repo.yml
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
