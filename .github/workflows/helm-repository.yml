name: Publish Helm repository
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release whose chart should be indexed
        required: true
        default: v0.7.0
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: helm-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.19.4}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install PyYAML==6.0.3
      - name: Retain prior versions and add released chart
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/build_chart_repository.py --release "$RELEASE_TAG"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - uses: actions/deploy-pages@v4
        id: deployment
